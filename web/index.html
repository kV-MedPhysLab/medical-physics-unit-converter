<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Medical Physics Unit Converter</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <main class="container">

        <header>
            <h1>Medical Physics Unit Converter</h1>

            <p>
                Scientific unit conversion tool for medical physics,
                radiation physics, and biomedical research.
            </p>
        </header>

        <section class="converter">

            <label for="value">Value</label>
            <input
                type="number"
                id="value"
                placeholder="Enter a value"
                step="any"
            >

            <div class="unit-row">

                <div>
                    <label for="fromUnit">From</label>

                    <select id="fromUnit">
                        <option value="Gy">Gy</option>
                        <option value="rad">rad</option>
                        <option value="Sv">Sv</option>
                        <option value="rem">rem</option>
                        <option value="eV">eV</option>
                        <option value="keV">keV</option>
                        <option value="MeV">MeV</option>
                        <option value="GeV">GeV</option>
                    </select>
                </div>

                <div>
                    <label for="toUnit">To</label>

                    <select id="toUnit">
                        <option value="rad">rad</option>
                        <option value="Gy">Gy</option>
                        <option value="rem">rem</option>
                        <option value="Sv">Sv</option>
                        <option value="keV">keV</option>
                        <option value="eV">eV</option>
                        <option value="MeV">MeV</option>
                        <option value="GeV">GeV</option>
                    </select>
                </div>

            </div>

            <button id="convertButton">
                Convert
            </button>

            <div id="result" class="result">
                Result will appear here.
            </div>

        </section>

        <footer>
            <p>
                kV-MedPhysLab · Medical Physics Unit Converter · v0.1.0
            </p>

            <p>
                For educational, research, and non-clinical use.
            </p>
        </footer>

    </main>

    <script src="app.js"></script>

</body>
</html>
